<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tersesat di Hutan - Imran & Nadilla</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS for WebRTC Multiplayer -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; user-select: none; }
        canvas { touch-action: none; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden">

    <!-- LOBBY & MAIN MENU CONTAINER -->
    <div id="lobbyContainer" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-slate-900 border border-slate-800 shadow-2xl rounded-2xl max-w-lg w-full p-6 text-center">
            
            <div class="inline-flex items-center gap-2 px-3 py-1 bg-emerald-950 border border-emerald-800/50 rounded-full text-emerald-400 text-xs font-semibold mb-3">
                <i class="fa-solid font-bold fa-heart text-pink-500"></i> Game Multiplayer 2 Pemain
            </div>

            <h1 class="text-3xl font-extrabold tracking-tight text-white mb-1">Tersesat di Hutan</h1>
            <p class="text-xs text-slate-400 mb-6">Petualangan Bertahan Hidup: Muhammad Dede Imran & Nadilla</p>

            <!-- ROOM INPUT & PEER CONNECTION -->
            <div class="bg-slate-950/70 p-4 rounded-xl border border-slate-800/80 mb-6 text-left">
                <label class="block text-xs font-semibold text-slate-400 mb-1">Kode Room (Untuk 2 Device Berbeda)</label>
                <div class="flex gap-2">
                    <input type="text" id="roomInput" value="hutan-cinta-2026" class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                    <button onclick="applyRoomCode()" class="bg-slate-800 hover:bg-slate-700 border border-slate-600 px-4 py-2 rounded-lg text-xs font-semibold text-slate-200 transition">
                        Hubungkan
                    </button>
                </div>
                <div class="flex items-center gap-2 mt-3 text-xs text-slate-400">
                    <span id="connStatusDot" class="w-2.5 h-2.5 rounded-full bg-amber-500 animate-pulse"></span>
                    <span id="connStatusText">Menghubungkan jaringan...</span>
                </div>
            </div>

            <!-- PLAYER ROLES & READY STATUS -->
            <div class="grid grid-cols-2 gap-4 mb-6">
                <!-- IMRAN CARD -->
                <div id="cardImran" onclick="selectRole('imran')" class="cursor-pointer border-2 border-slate-800 bg-slate-950/50 p-4 rounded-xl transition-all duration-300 hover:border-sky-500/50">
                    <div class="w-12 h-12 rounded-full bg-sky-950 border border-sky-600 text-sky-400 flex items-center justify-center mx-auto text-xl mb-2">
                        <i class="fa-solid fa-person"></i>
                    </div>
                    <div class="font-bold text-sm text-sky-200">Muhammad Dede Imran</div>
                    <div class="text-[11px] text-slate-400 mt-1">Peran: Suami</div>
                    <div id="badgeImran" class="mt-3 text-[10px] uppercase font-bold py-1 px-2 rounded-md bg-slate-800 text-slate-400">
                        Belum Masuk
                    </div>
                </div>

                <!-- NADILLA CARD -->
                <div id="cardNadilla" onclick="selectRole('nadilla')" class="cursor-pointer border-2 border-slate-800 bg-slate-950/50 p-4 rounded-xl transition-all duration-300 hover:border-pink-500/50">
                    <div class="w-12 h-12 rounded-full bg-pink-950 border border-pink-600 text-pink-400 flex items-center justify-center mx-auto text-xl mb-2">
                        <i class="fa-solid fa-person-dress"></i>
                    </div>
                    <div class="font-bold text-sm text-pink-200">Nadilla</div>
                    <div class="text-[11px] text-slate-400 mt-1">Peran: Istri</div>
                    <div id="badgeNadilla" class="mt-3 text-[10px] uppercase font-bold py-1 px-2 rounded-md bg-slate-800 text-slate-400">
                        Belum Masuk
                    </div>
                </div>
            </div>

            <!-- START BUTTON -->
            <button id="btnStart" disabled onclick="requestStartGame()" class="w-full py-3.5 px-6 rounded-xl font-bold text-sm tracking-wide transition-all shadow-lg bg-slate-800 text-slate-500 cursor-not-allowed">
                Mulai Petualangan (Menunggu Kedua Pemain)
            </button>
            <p class="text-[11px] text-slate-500 mt-3">
                *Buka <span class="text-sky-400 font-mono">imran.html</span> di HP 1 & <span class="text-pink-400 font-mono">nadilla.html</span> di HP 2!
            </p>
        </div>
    </div>

    <!-- MAIN GAME CANVAS & UI CONTAINER (Hidden by default) -->
    <div id="gameContainer" class="hidden flex-1 relative flex flex-col items-center justify-center bg-black">
        
        <!-- TOP HUD STATUS BAR -->
        <div class="absolute top-3 left-3 right-3 z-10 flex flex-wrap items-center justify-between gap-2 pointer-events-none">
            
            <!-- Vitals Bar (Current Player) -->
            <div class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-3 flex items-center gap-4 text-xs pointer-events-auto">
                <div id="playerAvatar" class="w-9 h-9 rounded-full bg-sky-950 border border-sky-500 flex items-center justify-center text-sky-400 font-bold">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="flex flex-col gap-1 w-32 sm:w-40">
                    <!-- HP -->
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-heart text-red-500 text-[10px] w-3"></i>
                        <div class="flex-1 bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="barHp" class="bg-red-500 h-full w-full transition-all"></div>
                        </div>
                    </div>
                    <!-- Hunger -->
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-utensils text-amber-500 text-[10px] w-3"></i>
                        <div class="flex-1 bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="barHunger" class="bg-amber-500 h-full w-full transition-all"></div>
                        </div>
                    </div>
                    <!-- Thirst -->
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-droplet text-blue-500 text-[10px] w-3"></i>
                        <div class="flex-1 bg-slate-800 h-2 rounded-full overflow-hidden">
                            <div id="barThirst" class="bg-blue-500 h-full w-full transition-all"></div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- World Time & Inventory Summary -->
            <div class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-xl p-3 flex items-center gap-4 text-xs pointer-events-auto">
                <div class="text-left">
                    <div class="text-slate-400 text-[10px]">Hari ke-<span id="txtDay" class="font-bold text-white">1</span></div>
                    <div id="txtTime" class="font-mono font-bold text-amber-400 text-sm">08:00 AM</div>
                </div>
                <div class="h-6 w-[1px] bg-slate-800"></div>
                <div class="flex items-center gap-3">
                    <span class="flex items-center gap-1 text-slate-300" title="Kayu"><i class="fa-solid fa-tree text-emerald-600"></i> <b id="invWood">0</b></span>
                    <span class="flex items-center gap-1 text-slate-300" title="Batu"><i class="fa-solid fa-cubes text-slate-400"></i> <b id="invStone">0</b></span>
                    <span class="flex items-center gap-1 text-slate-300" title="Berry"><i class="fa-solid fa-apple-whole text-red-400"></i> <b id="invBerries">0</b></span>
                </div>
            </div>
        </div>

        <!-- GAME CANVAS -->
        <canvas id="gameCanvas" class="w-full h-full block bg-emerald-950"></canvas>

        <!-- ACTION & CRAFTING CONTROLS (BOTTOM HUD) -->
        <div class="absolute bottom-4 left-4 right-4 z-10 flex items-end justify-between pointer-events-none">
            
            <!-- Mobile D-Pad Touch Controller -->
            <div class="pointer-events-auto grid grid-cols-3 gap-1 w-32 h-32 opacity-80 sm:opacity-50 hover:opacity-100 transition-opacity">
                <div></div>
                <button ontouchstart="setKey('ArrowUp', true)" ontouchend="setKey('ArrowUp', false)" class="bg-slate-900/80 active:bg-slate-700 border border-slate-700 rounded-lg flex items-center justify-center text-white"><i class="fa-solid fa-arrow-up"></i></button>
                <div></div>
                <button ontouchstart="setKey('ArrowLeft', true)" ontouchend="setKey('ArrowLeft', false)" class="bg-slate-900/80 active:bg-slate-700 border border-slate-700 rounded-lg flex items-center justify-center text-white"><i class="fa-solid fa-arrow-left"></i></button>
                <button onclick="interactAction()" class="bg-emerald-600 active:bg-emerald-500 border border-emerald-400 rounded-lg flex items-center justify-center text-white font-bold text-xs">AKSI</button>
                <button ontouchstart="setKey('ArrowRight', true)" ontouchend="setKey('ArrowRight', false)" class="bg-slate-900/80 active:bg-slate-700 border border-slate-700 rounded-lg flex items-center justify-center text-white"><i class="fa-solid fa-arrow-right"></i></button>
                <div></div>
                <button ontouchstart="setKey('ArrowDown', true)" ontouchend="setKey('ArrowDown', false)" class="bg-slate-900/80 active:bg-slate-700 border border-slate-700 rounded-lg flex items-center justify-center text-white"><i class="fa-solid fa-arrow-down"></i></button>
                <div></div>
            </div>

            <!-- Action Buttons Menu -->
            <div class="pointer-events-auto flex gap-2">
                <button onclick="craftItem('campfire')" class="bg-slate-900/90 hover:bg-slate-800 active:scale-95 border border-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 shadow-lg">
                    <i class="fa-solid fa-fire text-orange-500 text-sm"></i>
                    <span>Api Unggun</span>
                    <span class="text-[9px] text-slate-400">5 Kayu</span>
                </button>
                <button onclick="craftItem('shelter')" class="bg-slate-900/90 hover:bg-slate-800 active:scale-95 border border-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 shadow-lg">
                    <i class="fa-solid fa-house-chimney text-amber-500 text-sm"></i>
                    <span>Tenda</span>
                    <span class="text-[9px] text-slate-400">10 Kayu, 5 Batu</span>
                </button>
                <button onclick="craftItem('beacon')" class="bg-emerald-900/90 hover:bg-emerald-800 active:scale-95 border border-emerald-600 text-emerald-200 px-3 py-2 rounded-xl text-xs font-semibold flex flex-col items-center gap-1 shadow-lg">
                    <i class="fa-solid fa-tower-cell text-emerald-400 text-sm"></i>
                    <span>Sinyal Evakuasi</span>
                    <span class="text-[9px] text-emerald-300">20 Kayu, 15 Batu</span>
                </button>
            </div>
        </div>
    </div>

    <!-- GAME JS LOGIC ENGINE -->
    <script>
        // PEERJS WEBRTC MULTIPLAYER SETUP WITH BROADCASTCHANNEL FALLBACK
        let peer = null;
        let conn = null;
        let roomCode = 'hutan-cinta-2026';
        let myRole = null; // 'imran' or 'nadilla'

        // Local sync channel fallback for iframe / sandbox environments
        let localChannel = null;

        let gameState = {
            roomReady: { imran: false, nadilla: false },
            gameStarted: false,
            world: { day: 1, timeMinutes: 480, stage: 1 },
            players: {
                imran: { x: 200, y: 300, hp: 100, hunger: 100, thirst: 100, warmth: 100 },
                nadilla: { x: 250, y: 300, hp: 100, hunger: 100, thirst: 100, warmth: 100 }
            },
            inventory: { wood: 10, stone: 6, berries: 5, water: 3 },
            structures: [],
            resources: [],
            baby: { born: false, health: 100 }
        };

        const keysPressed = {};

        window.addEventListener('DOMContentLoaded', () => {
            setupLocalChannel();
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.has('role')) {
                selectRole(urlParams.get('role'));
            }
            applyRoomCode();
            initResources();
        });

        // Initialize local BroadcastChannel fallback
        function setupLocalChannel() {
            try {
                localChannel = new BroadcastChannel(`room_${roomCode}`);
                localChannel.onmessage = (e) => {
                    if (e.data && e.data.sender !== myRole) {
                        handleNetworkData(e.data);
                    }
                };
            } catch (err) {
                console.warn('BroadcastChannel fallback setup failed:', err);
            }
        }

        function applyRoomCode() {
            const inputVal = document.getElementById('roomInput').value.trim();
            if (inputVal) roomCode = inputVal;
            setupLocalChannel();
            initPeer();
        }

        function initPeer() {
            if (peer) peer.destroy();
            
            const peerId = `${roomCode}-${myRole || 'guest'}-${Math.floor(Math.random()*1000)}`;
            
            try {
                peer = new Peer(peerId);

                peer.on('open', () => {
                    document.getElementById('connStatusDot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
                    document.getElementById('connStatusText').innerText = `Terhubung ke Room: ${roomCode}`;
                    
                    if (myRole === 'nadilla') {
                        connectToPeer(`${roomCode}-imran`);
                    }
                });

                peer.on('connection', (incomingConn) => {
                    conn = incomingConn;
                    setupConnectionListeners();
                });

                peer.on('error', (err) => {
                    console.warn('PeerJS WebSockets disabled/restricted in sandbox. Switching to Local Broadcast mode:', err);
                    document.getElementById('connStatusDot').className = 'w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse';
                    document.getElementById('connStatusText').innerText = `Mode Lokal Aktif (${roomCode})`;
                });
            } catch (e) {
                console.warn('PeerJS execution prevented by security context:', e);
                document.getElementById('connStatusDot').className = 'w-2.5 h-2.5 rounded-full bg-blue-500 animate-pulse';
                document.getElementById('connStatusText').innerText = `Mode Lokal Canvas (${roomCode})`;
            }
        }

        function connectToPeer(targetId) {
            if (!peer) return;
            try {
                conn = peer.connect(targetId);
                setupConnectionListeners();
            } catch(e) {
                console.warn('Peer connect blocked:', e);
            }
        }

        function setupConnectionListeners() {
            if (!conn) return;
            conn.on('open', () => {
                sendNetworkData({ type: 'PRESENCE', role: myRole, ready: true });
            });

            conn.on('data', (data) => {
                handleNetworkData(data);
            });
        }

        function sendNetworkData(data) {
            data.sender = myRole;
            if (conn && conn.open) {
                try { conn.send(data); } catch(e){}
            }
            if (localChannel) {
                try { localChannel.postMessage(data); } catch(e){}
            }
        }

        function handleNetworkData(data) {
            if (data.type === 'PRESENCE') {
                gameState.roomReady[data.role] = data.ready;
                if (data.role !== myRole && myRole && gameState.roomReady[myRole]) {
                    if (localChannel) {
                        try {
                            localChannel.postMessage({ type: 'PRESENCE_ACK', role: myRole, ready: true, sender: myRole });
                        } catch(e){}
                    }
                }
                updateLobbyUI();
            } else if (data.type === 'PRESENCE_ACK') {
                gameState.roomReady[data.role] = data.ready;
                updateLobbyUI();
            } else if (data.type === 'START_GAME') {
                gameState.gameStarted = true;
                launchGameplay();
            } else if (data.type === 'MOVE') {
                if (data.role && data.role !== myRole) {
                    gameState.players[data.role].x = data.x;
                    gameState.players[data.role].y = data.y;
                }
            } else if (data.type === 'STATE_SYNC') {
                gameState.world = data.state.world;
                gameState.inventory = data.state.inventory;
                gameState.structures = data.state.structures;
                gameState.baby = data.state.baby;
                updateHUD();
            }
        }

        function selectRole(role) {
            myRole = role;
            gameState.roomReady[role] = true;
            
            initPeer();
            sendNetworkData({ type: 'PRESENCE', role: role, ready: true });
            updateLobbyUI();
        }

        function updateLobbyUI() {
            // Imran UI
            const cardImran = document.getElementById('cardImran');
            const badgeImran = document.getElementById('badgeImran');
            if (gameState.roomReady.imran) {
                cardImran.className = 'cursor-pointer border-2 border-sky-500 bg-sky-950/30 p-4 rounded-xl shadow-lg shadow-sky-950/50';
                badgeImran.className = 'mt-3 text-[10px] uppercase font-bold py-1 px-2 rounded-md bg-sky-500 text-white animate-pulse';
                badgeImran.innerText = 'SIAP / TERHUBUNG';
            }

            // Nadilla UI
            const cardNadilla = document.getElementById('cardNadilla');
            const badgeNadilla = document.getElementById('badgeNadilla');
            if (gameState.roomReady.nadilla) {
                cardNadilla.className = 'cursor-pointer border-2 border-pink-500 bg-pink-950/30 p-4 rounded-xl shadow-lg shadow-pink-950/50';
                badgeNadilla.className = 'mt-3 text-[10px] uppercase font-bold py-1 px-2 rounded-md bg-pink-500 text-white animate-pulse';
                badgeNadilla.innerText = 'SIAP / TERHUBUNG';
            }

            // Start Button Status
            const btnStart = document.getElementById('btnStart');
            if (gameState.roomReady.imran && gameState.roomReady.nadilla) {
                btnStart.disabled = false;
                btnStart.className = 'w-full py-3.5 px-6 rounded-xl font-bold text-sm tracking-wide transition-all shadow-lg bg-emerald-500 hover:bg-emerald-400 text-white cursor-pointer animate-bounce';
                btnStart.innerText = 'Mulai Petualangan (Semua Siap)';
            } else {
                btnStart.disabled = true;
                btnStart.className = 'w-full py-3.5 px-6 rounded-xl font-bold text-sm tracking-wide transition-all shadow-lg bg-slate-800 text-slate-500 cursor-not-allowed';
                btnStart.innerText = 'Mulai Petualangan (Menunggu Kedua Pemain)';
            }
        }

        function requestStartGame() {
            if (gameState.roomReady.imran && gameState.roomReady.nadilla) {
                sendNetworkData({ type: 'START_GAME' });
                gameState.gameStarted = true;
                launchGameplay();
            }
        }

        function launchGameplay() {
            document.getElementById('lobbyContainer').classList.add('hidden');
            document.getElementById('gameContainer').classList.remove('hidden');
            
            // Set Avatar
            const avatar = document.getElementById('playerAvatar');
            if (myRole === 'imran') {
                avatar.className = 'w-9 h-9 rounded-full bg-sky-950 border border-sky-500 flex items-center justify-center text-sky-400 font-bold';
                avatar.innerHTML = '<i class="fa-solid fa-person"></i>';
            } else {
                avatar.className = 'w-9 h-9 rounded-full bg-pink-950 border border-pink-500 flex items-center justify-center text-pink-400 font-bold';
                avatar.innerHTML = '<i class="fa-solid fa-person-dress"></i>';
            }

            initCanvas();
            startLoop();
        }

        // --- GAME ENGINE & CANVAS SETUP ---
        let canvas, ctx;

        function initCanvas() {
            canvas = document.getElementById('gameCanvas');
            ctx = canvas.getContext('2d');
            resizeCanvas();
            window.addEventListener('resize', resizeCanvas);

            window.addEventListener('keydown', (e) => keysPressed[e.key] = true);
            window.addEventListener('keyup', (e) => keysPressed[e.key] = false);
        }

        function setKey(key, val) {
            keysPressed[key] = val;
        }

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initResources() {
            gameState.resources = [];
            for (let i = 0; i < 20; i++) {
                gameState.resources.push({
                    id: i,
                    type: i % 3 === 0 ? 'tree' : (i % 3 === 1 ? 'rock' : 'berry'),
                    x: Math.random() * 1200 + 100,
                    y: Math.random() * 800 + 100
                });
            }
        }

        function interactAction() {
            if (!myRole) return;
            const p = gameState.players[myRole];
            
            gameState.resources.forEach((r, idx) => {
                const dist = Math.hypot(p.x - r.x, p.y - r.y);
                if (dist < 40) {
                    if (r.type === 'tree') gameState.inventory.wood += 2;
                    if (r.type === 'rock') gameState.inventory.stone += 2;
                    if (r.type === 'berry') gameState.inventory.berries += 3;

                    // Relocate resource
                    r.x = Math.random() * 1200 + 100;
                    r.y = Math.random() * 800 + 100;
                    
                    updateHUD();
                    syncState();
                }
            });
        }

        function craftItem(type) {
            if (type === 'campfire' && gameState.inventory.wood >= 5) {
                gameState.inventory.wood -= 5;
                const p = gameState.players[myRole];
                gameState.structures.push({ type: 'campfire', x: p.x + 20, y: p.y });
            } else if (type === 'shelter' && gameState.inventory.wood >= 10 && gameState.inventory.stone >= 5) {
                gameState.inventory.wood -= 10;
                gameState.inventory.stone -= 5;
                const p = gameState.players[myRole];
                gameState.structures.push({ type: 'shelter', x: p.x + 30, y: p.y });
                // Check family story progression
                if (!gameState.baby.born) {
                    gameState.baby.born = true;
                    showNotification("❤️ Selamat! Imran & Nadilla kini dikaruniai seorang bayi di tempat pengungsian!");
                }
            } else if (type === 'beacon' && gameState.inventory.wood >= 20 && gameState.inventory.stone >= 15) {
                showNotification("🎉 KEMENANGAN! Sinyal Evakuasi Berhasil Dibuat! Tim Penyelamat Datang Meniup Sirine!");
            }
            updateHUD();
            syncState();
        }

        function showNotification(msg) {
            const notif = document.createElement('div');
            notif.className = 'fixed top-20 left-1/2 -translate-x-1/2 bg-emerald-600 text-white px-6 py-3 rounded-full shadow-2xl font-bold text-sm z-50 animate-bounce';
            notif.innerText = msg;
            document.body.appendChild(notif);
            setTimeout(() => notif.remove(), 5000);
        }

        function updateHUD() {
            document.getElementById('invWood').innerText = gameState.inventory.wood;
            document.getElementById('invStone').innerText = gameState.inventory.stone;
            document.getElementById('invBerries').innerText = gameState.inventory.berries;
            
            if (myRole && gameState.players[myRole]) {
                const p = gameState.players[myRole];
                document.getElementById('barHp').style.width = p.hp + '%';
                document.getElementById('barHunger').style.width = p.hunger + '%';
                document.getElementById('barThirst').style.width = p.thirst + '%';
            }
        }

        function syncState() {
            sendNetworkData({ type: 'STATE_SYNC', state: gameState });
        }

        // MAIN GAME LOOP
        let lastSyncTime = 0;
        function startLoop() {
            function loop(timestamp) {
                updatePlayerMovement();
                renderCanvas();

                // Periodic State Sync (Every 2 seconds)
                if (timestamp - lastSyncTime > 2000) {
                    syncState();
                    lastSyncTime = timestamp;
                }

                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }

        function updatePlayerMovement() {
            if (!myRole || !gameState.players[myRole]) return;
            const p = gameState.players[myRole];
            const speed = 3;
            let moved = false;

            if (keysPressed['ArrowUp'] || keysPressed['w'] || keysPressed['W']) { p.y -= speed; moved = true; }
            if (keysPressed['ArrowDown'] || keysPressed['s'] || keysPressed['S']) { p.y += speed; moved = true; }
            if (keysPressed['ArrowLeft'] || keysPressed['a'] || keysPressed['A']) { p.x -= speed; moved = true; }
            if (keysPressed['ArrowRight'] || keysPressed['d'] || keysPressed['D']) { p.x += speed; moved = true; }

            if (moved) {
                sendNetworkData({ type: 'MOVE', role: myRole, x: p.x, y: p.y });
            }
        }

        function renderCanvas() {
            if (!ctx) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render Grass Background Grid
            ctx.fillStyle = '#052e16';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Render Resources
            gameState.resources.forEach(r => {
                if (r.type === 'tree') {
                    ctx.fillStyle = '#15803d';
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, 14, 0, Math.PI * 2);
                    ctx.fill();
                } else if (r.type === 'rock') {
                    ctx.fillStyle = '#64748b';
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, 10, 0, Math.PI * 2);
                    ctx.fill();
                } else if (r.type === 'berry') {
                    ctx.fillStyle = '#f43f5e';
                    ctx.beginPath();
                    ctx.arc(r.x, r.y, 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Render Structures
            gameState.structures.forEach(s => {
                if (s.type === 'campfire') {
                    ctx.fillStyle = '#f97316';
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, 12, 0, Math.PI * 2);
                    ctx.fill();
                } else if (s.type === 'shelter') {
                    ctx.fillStyle = '#b45309';
                    ctx.fillRect(s.x - 20, s.y - 15, 40, 30);
                }
            });

            // Render Baby (if born)
            if (gameState.baby.born) {
                const imran = gameState.players.imran;
                ctx.fillStyle = '#f472b6';
                ctx.beginPath();
                ctx.arc(imran.x + 15, imran.y + 15, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            // Render Player Imran
            const imran = gameState.players.imran;
            ctx.fillStyle = '#38bdf8';
            ctx.beginPath();
            ctx.arc(imran.x, imran.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '10px sans-serif';
            ctx.fillText('Imran', imran.x - 12, imran.y - 16);

            // Render Player Nadilla
            const nadilla = gameState.players.nadilla;
            ctx.fillStyle = '#ec4899';
            ctx.beginPath();
            ctx.arc(nadilla.x, nadilla.y, 12, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.font = '10px sans-serif';
            ctx.fillText('Nadilla', nadilla.x - 14, nadilla.y - 16);
        }
    </script>
</body>
</html>
